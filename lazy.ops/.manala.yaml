manala:
    description: Ops environment, opiniated and docker based, for lazy people
    template: .manala.yaml.tmpl
    sync:
      - .manala/bin
      - .manala/docker
      - .manala/etc
      - .manala/github
      - .manala/gitlab
      - .manala/make
      - .manala/.dockerignore
      - .manala/.gitignore
      - .manala/Makefile.tmpl
      - Makefile.dist
      - README.md .manala/README.md

###########
# Project #
###########

project:
    # @schema {"type": "string", "minLength": 1, "pattern": "^[a-z0-9][a-z0-9_-]*$"}
    # @option {"label": "Project name"}
    name: ~
    # @schema {"type": ["null", "string"]}
    help: ~

##########
# System #
##########

system:
    dir: ~
    locale: C.UTF-8
    # @schema {
    #     "additionalProperties": {"type": ["string", "integer"]},
    #     "propertyNames": {"pattern": "^[A-Z_]+$"}
    # }
    env: {}
    # @schema {
    #     "type": ["string", "array"],
    #     "items": {"oneOf": [
    #         {"type": "string"},
    #         {
    #             "type": "object",
    #             "properties": {
    #                  "path": {"type": "string"},
    #                  "required": {"type": "boolean"}
    #             },
    #             "required": ["path"],
    #             "additionalProperties": false
    #         }
    #     ]}
    # }
    env_file: []
    # @schema {"items": {"type": "string"}}
    mount: []
    # @schema {"items": {"type": "string"}}
    tmpfs: []
    starship:
        # @schema {"type": ["null", "string"]}
        config: ~
    docker: false
    apt:
        # @schema {"items": {"type": "string"}}
        packages: []
    git:
        # @schema {"type": ["null", "string"]}
        config: ~
    ssh:
        # @schema {"type": ["null", "string"]}
        config: ~
    ansible:
        # @schema {"enum": [null, "2.19.15", "2.18.20", "2.17.14", "2.16.20"]}
        # @option {"label": "Ansible version"}
        version: ~
        # @schema {"type": ["null", "string"]}
        config: ~
        # @schema {"items": {"type": "string"}}
        dependencies: []
    ansible-lint:
        # @schema {"enum": [null, "26.11.0", "26.6.0", "26.4.0", "26.2.0", "25.9.2", "25.7.0"]}
        # @option {"label": "Ansible-lint version"}
        version: ~
        # @schema {"items": {"type": "string"}}
        dependencies: []
    ansible-creator:
        # @schema {"enum": [null, "26.11.0", "26.6.1", "26.4.3"]}
        # @option {"label": "Ansible-creator version"}
        version: ~
    molecule:
        # @schema {"enum": [null, "26.11.0", "26.6.0", "26.4.0", "26.2.0", "25.9.0", "25.7.0"]}
        # @option {"label": "Molecule version"}
        version: ~
        # @schema {"items": {"type": "string"}}
