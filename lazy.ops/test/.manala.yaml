manala:
    repository: ../..
    recipe: lazy.ops

project:
    name: lazy-ops-test

system:
    locale: en_US.UTF-8
    env:
        TEST: test
    env_file:
        - fixtures/.env.1
        - path: fixtures/.env.2
        - path: fixtures/.env.3
          required: false
    mount:
        - fixtures/mount_relative
        - fixtures/mount_native:/fixtures/mount_native
    tmpfs:
        - /tmpfs
        - /tmpfs/exec:exec
    docker: true
    apt:
        packages:
            - goss
            - nano
    git:
        config: |
            # Git config
    ssh:
        config: |
            # Ssh config
    ansible:
        version: 2.19.15
        config: |
            # Ansible config
        dependencies:
            - hvac==2.4.0
    ansible-lint:
        version: 26.11.0
        dependencies:
            - pytest==9.2.0
    ansible-creator:
        version: 26.11.0
    molecule:
        version: 26.11.0
        dependencies:
            - molecule-plugins==26.11.0
            - molecule-plugins[docker]==26.11.0
    terraform:
        version: 1.17.1
    kubectl:
        version: 1.37.2
    kustomize:
        version: 5.8.3
    krew:
        version: 0.5.0
        plugins:
            - ns
    helm:
        version: 4.3.1
        plugins:
            - url: https://github.com/databus23/helm-diff
              version: 3.15.15
              verify: false
    helmfile:
        version: 1.8.2
    k9s:
        version: 0.51.0
    stern:
        version: 1.35.0
    popeye:
        version: 0.22.1
    vault:
        version: 2.2.1
        token_helper: true
    rclone:
        version: 1.75.2
    openstack:
        version: 10.5.0
    swift:
        version: 4.11.0
        keystone:
            version: 6.0.0
    scw:
        version: 2.65.2
    ovhcloud:
        version: 0.16.0
    sops:
        version: 3.13.3
    aws:
        version: 2.39.4
        config: |
            [profile test]
    gcloud:
        version: 592.0.0
        components:
            - gke-gcloud-auth-plugin
    age:
        version: 1.3.2
    argocd:
        version: 3.6.1
