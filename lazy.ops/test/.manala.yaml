manala:
    repository: ../..
    recipe: lazy.ops

project:
    name: lazy-ops-test

system:
    locale: en_US.UTF-8
    env:
        TEST: test
    env_file:
        - fixtures/.env.1
        - path: fixtures/.env.2
        - path: fixtures/.env.3
          required: false
    mount:
        - fixtures/mount_relative
        - fixtures/mount_native:/fixtures/mount_native
    tmpfs:
        - /tmpfs
        - /tmpfs/exec:exec
    docker: true
    apt:
        packages:
            - goss
            - nano
    git:
        config: |
            # Git config
    ssh:
        config: |
            # Ssh config
    ansible:
        version: 2.19.11
        config: |
            # Ansible config
        dependencies:
            - hvac==2.4.0
    ansible-lint:
        version: 26.6.0
        dependencies:
            - pytest==9.1.1
    ansible-creator:
        version: 26.6.1
    molecule:
        version: 26.6.0
        dependencies:
            - molecule-plugins==26.7.15
            - molecule-plugins[docker]==26.7.15
    terraform:
        version: 1.15.8
    kubectl:
        version: 1.36.3
    kustomize:
        version: 5.8.1
    krew:
        version: 0.5.0
        plugins:
            - ns
    helm:
        version: 4.2.3
        plugins:
            - url: https://github.com/databus23/helm-diff
              version: 3.15.11
              verify: false
    helmfile:
        version: 1.7.3
    k9s:
        version: 0.51.0
    stern:
        version: 1.34.0
    popeye:
        version: 0.22.1
    vault:
        version: 2.0.4
    rclone:
        version: 1.75.0
    openstack:
        version: 10.2.1
    swift:
        version: 4.10.0
        keystone:
            version: 5.8.0
    scw:
        version: 2.60.0
    ovhcloud:
        version: 0.12.0
    sops:
        version: 3.13.3
    aws:
        version: 2.36.19
        config: |
            [profile test]
    gcloud:
        version: 579.0.0
        components:
            - gke-gcloud-auth-plugin
    age:
        version: 1.3.1
    argocd:
        version: 3.5.0
