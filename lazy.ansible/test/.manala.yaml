manala:
    repository: ../..
    recipe: lazy.ansible

project:
    name: lazy-ansible-test

system:
    locale: en_US.UTF-8
    env:
        TEST: test
    env_file:
        - fixtures/.env.1
        - path: fixtures/.env.2
        - path: fixtures/.env.3
          required: false
    mount:
        - fixtures/mount_relative
        - fixtures/mount_native:/fixtures/mount_native
    tmpfs:
        - /tmpfs
        - /tmpfs/exec:exec
    docker: true
    apt:
        packages:
            - goss
            - nano
    git:
        config: |
            # Git config
    ssh:
        config: |
            # Ssh config
    ansible:
        version: 2.19.11
        config: |
            # Ansible config
        dependencies:
            - hvac==2.4.0
    ansible-lint:
        version: 26.6.0
        dependencies:
            - pytest==9.1.1
    ansible-creator:
        version: 26.6.1
    molecule:
        version: 26.6.0
        dependencies:
            - molecule-plugins==26.7.15
            - molecule-plugins[docker]==26.7.15
    terraform:
        version: 1.15.8
    aws:
        version: 2.36.19
        config: |
            [profile test]
    gcloud:
        version: 579.0.0
        components:
            - gke-gcloud-auth-plugin
