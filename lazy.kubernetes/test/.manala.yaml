manala:
    repository: ../..
    recipe: lazy.kubernetes

project:
    name: lazy-kubernetes-test

system:
    locale: en_US.UTF-8
    env:
        TEST: test
    env_file:
        - fixtures/.env.1
        - path: fixtures/.env.2
        - path: fixtures/.env.3
          required: false
    mount:
        - fixtures/mount_relative
        - fixtures/mount_native:/fixtures/mount_native
    tmpfs:
        - /tmpfs
        - /tmpfs/exec:exec
    docker: true
    apt:
        packages:
            - goss
            - nano
    git:
        config: |
            # Git config
    kubectl:
        version: 1.36.1
    kustomize:
        version: 5.8.1
    krew:
        version: 0.5.0
        plugins:
            - ns
    helm:
        version: 4.2.0
        plugins:
            - url: https://github.com/databus23/helm-diff
              version: 3.15.7
              verify: false
    helmfile:
        version: 1.5.2
    k9s:
        version: 0.50.18
    stern:
        version: 1.34.0
    popeye:
        version: 0.22.1
    vault:
        version: 2.0.1
    rclone:
        version: 1.74.2
    openstack:
        version: 10.0.0
    swift:
        version: 4.10.0
        keystone:
            version: 5.8.0
    scw:
        version: 2.56.0
    sops:
        version: 3.13.1
    aws:
        version: 2.34.53
        config: |
            [profile test]
    gcloud:
        version: 569.0.0
        components:
            - gke-gcloud-auth-plugin
    age:
        version: 1.3.1
    argocd:
        version: 3.4.2
